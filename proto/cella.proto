// The one language of the network model (docs/NETWORK-MODEL.md).
// Every party speaks it: the membrane inside the appliance, the
// cella-gateway CLI, and the engine that decides on the longer
// term. Field numbers are the wire contract: never reuse one.
syntax = "proto3";
package cella;

// The envelope on the control wire. A raw byte line has no method
// dispatch, thus every crossing is one length-delimited Message.
message Message {
  oneof body {
    Accord accord = 1;
    Event event = 2;
    Decision decision = 3;
    Valve valve = 4;
    Audit audit = 5;
  }
}

// The witnessed border: every verb is an event, show, inspect,
// and extract included -- an evidence read is on the record like
// any other act. The chronicle stays the operations ledger; the
// verbs get their own audit stream in this same language. The operator
// acts in host time -- a CLI has no guest clock -- thus the audit
// stream carries the host clock alone. Machine-scoped verbs append
// to machines/<vm>/audit; the placeless verbs to the audit file at
// the CELLA_HOME root.
message Audit {
  string verb = 1;
  repeated string args = 2;
  uint32 uid = 3;
  // The gid rides for SELinux debugging.
  uint32 gid = 4;
  string persona = 5;
  uint64 host_ns = 6;
  // The tamper-evident chain (1.6.14d): the SHA-256 of the
  // predecessor entry's framed bytes, predecessor field included.
  // The first entry in a book chains from the empty digest
  // (SHA-256 of zero bytes) -- there is no predecessor to name.
  bytes predecessor = 15;
}

// The version handshake: two ends agree on the language before
// anything else crosses. Version 2: releases carry no allow --
// field 1 of Release and field 5 of Released are retired, and a
// release delivers one named operation, once. Version 3: the
// Operation carries its direction -- the border judges both ways,
// and the chronicle records which way each crossing faced.
// Version 4: a Decision can carry a MembraneMemory (field 4) -- a
// standing entry for the membrane's memory file, beside the
// per-operation release and refusal. An older end refuses the
// handshake rather than silently dropping what it cannot carry.
message Accord {
  uint32 version = 1;
}

// Where an operation points. The host name is present when the
// appliance resolved it -- the ratchet acts on names; the ip is
// what went to the wire. The name is testimony, not truth: the
// membrane stamps it from the DNS answers it itself delivered
// (the name ratchet), a hostile resolver can bind any name to
// any ip, and the judge weighs it as testimony. The ratchet is
// durable: learned bindings persist in the machine's names file
// (network/names) and a thaw wakes knowing them -- the freeze a
// park causes must not erase the name that would stamp the next
// park of the same flow. A newer answer supersedes an older one.
message Destination {
  string host = 1;
  bytes ip = 2;
  uint32 port = 3;
  // The IP protocol number (6 = TCP, 17 = UDP). Two operations can
  // share an ip and a port on different protocols; the chronicle
  // must tell them apart at a thaw rebind.
  uint32 proto = 4;
  // The most primitive name a frame has. Every operation carries
  // its ethertype (0x0800 for IPv4, 0x0806 for ARP, 0x86dd for
  // IPv6); a frame that parses no further than the Ethernet
  // header carries its destination MAC here, and the ip stays
  // empty. Every egress frame parks under one of the two shapes:
  // nothing crosses the membrane unnamed.
  uint32 ethertype = 5;
  bytes mac = 6;
}

// One held egress flow. The identifier is a UUIDv7, minted in the
// guest frame: identifiers repeat across branched twins, thus the
// engine keys on the machine name plus the identifier. Both clocks
// ride along -- guest_ns is the T of the timeline rewrite,
// host_ns serves the ledger math.
message Operation {
  // Which way the crossing faces. OUTGOING names the peer by the
  // frame's destination; INCOMING names it by the frame's source.
  // Old entries decode as OUTGOING, which is what they were.
  enum Direction {
    OUTGOING = 0;
    INCOMING = 1;
  }
  bytes id = 1;
  Destination destination = 2;
  uint64 guest_ns = 3;
  uint64 host_ns = 4;
  Direction direction = 5;
}

// A ledger entry: the chronicle of one operation's life.
message Event {
  oneof event {
    Operation parked = 1;
    Released released = 2;
    Lapsed lapsed = 3;
    Inspected inspected = 4;
  }
  // The tamper-evident chain (1.6.14d): the SHA-256 of the
  // predecessor entry's framed bytes, predecessor field included.
  // The first entry in a book chains from the empty digest
  // (SHA-256 of zero bytes) -- there is no predecessor to name.
  bytes predecessor = 15;
}

// The look is itself recorded: the operator read a held
// operation's frames (cella gateway inspect, frozen-only). An
// Inspected event resolves nothing -- the operation stays held --
// and it changes no state in either automaton.
message Inspected {
  bytes id = 1;
}

message Released {
  bytes id = 1;
  uint64 first_response_ns = 2;
  uint64 bytes_in = 3;
  uint64 bytes_out = 4;
  // Field 5 (allow_flow) is retired: no pass entries exist, thus
  // no release carries an allow. Never reuse the number.
  reserved 5;
}

message Lapsed {
  bytes id = 1;
  string why = 2;
}

// The external word on one operation. A release delivers one
// named operation, once -- the only allow that exists. A refusal
// answers the machine cleanly, in-frame, instead of by timeout.
// Freezing is absent on purpose: the freeze is a machine verb,
// and the membrane only keeps holding.
message Decision {
  // Empty for a membrane_memory: a memory names a destination, not
  // an operation -- release and refuse answer a park, a memory
  // outlives one.
  bytes id = 1;
  oneof decision {
    Release release = 2;
    Refusal refusal = 3;
    MembraneMemory membrane_memory = 4;
  }
}

message Release {
  // Field 1 (allow_flow) is retired: a release names one
  // operation and delivers it, nothing more. Never reuse the
  // number.
  reserved 1;
}

message Refusal {
  string why = 1;
}

// The posture of the valve. Closed: nothing goes
// in or out. Open is the membrane: egress parks for decisions.
// No posture forwards freely.
message Valve {
  enum V {
    CLOSED = 0;
    OPEN = 1;
  }
  V v = 1;
}

// The membrane's memory (N.F.7): one standing entry per
// destination. The membrane-memory file frames MembraneMemory
// messages directly, valve-style, and the membrane reads it on
// the kick. The write surface is the engine seam alone; no
// operator verb writes it. A memory rides the Decide stream as a
// Decision (Accord version 4) and lands through the bridge -- the
// written stamp, the kick, the witness. A memory
// affects freezing, never crossing: release and refuse stay the
// judge's alone, and every crossing still parks, gets its id, and
// lands in the chronicle. Every zero decodes to the cryogenic
// default -- an absent field, an absent entry, or an absent file
// all mean today's behavior: the park is the freeze.
message MembraneMemory {
  Destination destination = 1;
  // Park matching egress and keep the machine running while the
  // decision arrives, instead of freezing. Outgoing only: an
  // incoming park never freezes, thus there is nothing to skip.
  bool skip_freeze = 2;
  // Seconds -- a policy window, not a measurement. The entry
  // stands while now < written + keep_open, then dies on its own:
  // fail-closed, an abandoned memory cannot outlive its window,
  // and eternal is not expressible. 0 = inert.
  uint64 keep_open = 3;
  // The bridge's host-clock stamp, epoch seconds, set as the entry
  // lands in the file. Expiry is absolute and stateless -- any VMM
  // at any read computes it, and nothing re-anchors at a thaw: an
  // expired memory stays expired. The window burns in host time,
  // deliberately: the memory belongs to the judge's world, and its
  // risk window is real-world time -- a freeze does not preserve
  // it. The VMM never writes the stamp. 0 = inert (an expiry that
  // cannot be computed fails closed).
  uint64 written = 4;
}

// The gRPC face of the same vocabulary, outside every VMM: the
// engine decides -- events in, decisions out.
service Engine {
  rpc Decide(stream Event) returns (stream Decision);
}
