# The workspace: per-persona crates over one cella-libs
# A binary contains only its own verbs; the
# commons live in cella-libs behind features, thus what a binary does
# not need is not compiled into it -- thinness by the feature graph,
# not by trust in the linker.
[workspace]
resolver = "2"
members = [
    "crates/cella",
    "crates/cella-libs",
    "crates/cella-vmm",
    "crates/cella-machine",
    "crates/cella-gateway",
    "crates/cella-universe",
    "crates/cella-build",
    "crates/cella-doctor",
    "crates/cella-network",
    "crates/cella-probe",
    "crates/cella-engine",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
cella-libs = { path = "crates/cella-libs" }
cella-build = { path = "crates/cella-build" }
libc = "0.2"
kvm-ioctls = "0.19"
kvm-bindings = { version = "0.10", features = ["fam-wrappers"] }
vm-memory = { version = "0.16", features = ["backend-mmap"] }
linux-loader = { version = "0.13", features = ["bzimage", "elf"] }
vm-superio = "0.8"
virtio-queue = "0.14"
vmm-sys-util = "0.12"
sha3 = "0.10"
sha2 = "0.10"
prost = "0.13"
prost-build = "0.13"
tonic = "0.12"
tonic-build = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tokio-stream = "0.1"

[profile.release]
panic = "abort"
lto = true

# The lab profile: release-sized (the debug profile's binary does not
# fit the nested images), with debug-assertions on -- the console
# exists only where they are on. The smokes and probes pin to it.
[profile.smoke]
inherits = "release"
debug-assertions = true
